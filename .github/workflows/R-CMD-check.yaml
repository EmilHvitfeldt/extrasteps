# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}

          - {os: windows-latest, r: 'release'}
          # use 4.0 or 4.1 to check with rtools40's older compiler
          - {os: windows-latest, r: 'oldrel-4'}

          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}
          - {os: ubuntu-latest,  r: 'oldrel-4'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # CRAN's macOS binary for gower (a recipes dependency) references
      # OpenMP's ___kmpc_barrier via flat-namespace lookup without declaring
      # a load-time dependency on libomp, so it only resolves if libomp is
      # already loaded into the process. R's signed binary strips
      # DYLD_INSERT_LIBRARIES, so libomp has to be dyn.load()-ed from R
      # itself (with local = FALSE, to expose its symbols globally) before
      # gower is loaded; R_PROFILE runs that for every R process R CMD
      # check spawns. See https://mac.r-project.org/openmp/
      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LO https://mac.r-project.org/openmp/openmp-19.1.5-darwin20-Release.tar.gz
          sudo tar fvxz openmp-19.1.5-darwin20-Release.tar.gz -C /
          echo 'dyn.load("/usr/local/lib/libomp.dylib", local = FALSE)' > "$RUNNER_TEMP/preload-omp.R"
          echo "R_PROFILE=$RUNNER_TEMP/preload-omp.R" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
